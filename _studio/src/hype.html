<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>body{width:1280px;height:720px}.c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring{position:absolute;left:50%;top:50%;border:1.5px solid #ffffff55;border-radius:50%;transform:translate(-50%,-50%)}
#rows{position:absolute;left:140px;right:140px;top:90px;font-size:26px;line-height:54px;color:#c9c7d8;font-weight:400}
#rows div{display:flex;justify-content:space-between;border-bottom:1px solid #ffffff14;white-space:nowrap}
#rows span{display:inline-block}
.big{font-size:150px;line-height:1}.w{font-size:96px}
.bar{position:absolute;top:210px;width:56px;height:300px;background:#f1f0f6;border-radius:8px}
#glow{position:absolute;left:584px;top:312px;width:112px;height:96px;background:linear-gradient(100deg,#7df9e1,#9d7bff 50%,#ff7bd5);filter:blur(22px)}
</style><body><div class="amb" id="amb"></div><div class="scan"></div>
<div class="c" id="s1"><div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="ring" id="r3"></div><div class="mi" style="font-size:44px;line-height:1.4;position:relative">Every transfer<br>leaves an echo.</div></div>
<div id="rows"></div>
<div class="c" id="s3"><div class="mi big iri">Cloak it.</div></div>
<div class="c" id="s4"><div class="mi w" id="word"></div></div>
<div id="s5" class="abs" style="inset:0"><div class="bar" id="b1"></div><div class="bar" id="b2"></div><div id="glow"></div>
<div class="abs mi" id="tag" style="left:0;right:0;top:560px;text-align:center;font-size:30px;letter-spacing:.06em">Money that doesn't <span class="iri">echo.</span></div>
<div class="abs" id="dom" style="left:0;right:0;top:622px;text-align:center;font-size:21px;letter-spacing:.2em;color:#9d9bad">HUSH · hUSD · hushmoneyrh.xyz</div></div>
<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>1-Math.pow(1-cl(x),3),win=(t,a,b,f=.25)=>cl((t-a)/f)*cl((b-t)/f);
const R=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const h4=()=>Array.from({length:4},()=>Math.floor(rnd()*16).toString(16)).join('');const hx=()=>'0x'+h4()+'…'+h4();
for(let i=0;i<10;i++){R.push([hx(),hx(),'$'+(Math.floor(rnd()*90000)+400).toLocaleString('en-US')]);}
$('rows').innerHTML=R.map((r)=>`<div><span>${r[0]}  →  ${r[1]}</span><span>${r[2]}</span></div>`).join('');
const W=['MINT','CLOAK','SEND','DROP','MIRROR','BLIND DESK','ERASE'];
window.__seek=(t)=>{
  $('amb').style.transform=`rotate(${t*4}deg) scale(${1+t*.02})`;
  $('s1').style.opacity=win(t,0,1.7);['r1','r2','r3'].forEach((id,k)=>{const p=cl((t-k*.35)/1.5);const d=120+p*1100;$(id).style.width=$(id).style.height=d+'px';$(id).style.opacity=(1-p)*.8;});
  $('rows').style.opacity=win(t,1.6,3.4);$('rows').style.transform=`translateY(${-(t-1.6)*26}px)`;
  [...$('rows').children].forEach((d,i)=>{const p=cl((t-2.3-i*.06)/.5);[...d.children].forEach((s)=>{s.style.filter=`blur(${p*13}px)`;s.style.color=p>.5?'transparent':'';s.style.background=p>.5?'linear-gradient(100deg,#7df9e1,#9d7bff,#ff7bd5)':'';s.style.borderRadius='6px';});});
  $('s3').style.opacity=win(t,3.3,5,.2);$('s3').firstElementChild.style.transform=`scale(${.86+e((t-3.3)/1.7)*.16})`;$('s3').firstElementChild.style.filter=`blur(${(1-e((t-3.3)/.5))*24}px)`;
  const k=Math.floor((t-5)/.36);$('s4').style.opacity=(t>=5&&t<7.52)?1:0;if(k>=0&&k<W.length){$('word').textContent=W[k];const f=((t-5)%.36)/.36;$('word').style.filter=`blur(${(1-e(f*3))*18}px)`;$('word').className='mi w'+(k%2?' iri':'');}
  const p=e((t-7.5)/.9);$('s5').style.opacity=t>=7.5?1:0;$('b1').style.left=(528-(1-p)*700)+'px';$('b2').style.left=(696+(1-p)*700)+'px';$('glow').style.opacity=e((t-8.2)/.8);$('glow').style.filter=`blur(${22+Math.sin(t*3)*4}px)`;
  $('tag').style.opacity=e((t-8.5)/.6);$('dom').style.opacity=e((t-9)/.5);
};window.__seek(0);
</script>
