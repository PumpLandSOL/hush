<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>body{width:1280px;height:720px}.c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}

</style><body><div class="amb" id="amb"></div><div class="scan"></div>
<div class="c" id="s1"><div><div class="k" id="k1">HUSH · PROTOCOL UPDATE</div><div class="mi iri" id="t1" style="font-size:112px;margin-top:26px;line-height:1.05">Quiet Yield</div></div></div>
<div class="c" id="s2"><div><div class="huge iri" id="pct">0%</div><div class="mi" style="font-size:36px;margin-top:10px">of every fee. Paid to you.</div></div></div>
<div id="s3" class="abs" style="inset:0"><div id="fees"></div><div id="vault"><div class="l">hUSD · CLOAKED</div><div id="glass"></div><div class="l">QUIET YIELD · EARNED</div><div id="earn">+0.0000</div></div>
<div class="abs mi" style="left:90px;top:70px;font-size:26px;letter-spacing:.1em">Every fee streams <span class="iri">into the cloak.</span></div></div>

<div id="s5" class="abs" style="inset:0"><div class="bar" id="b1"></div><div class="bar" id="b2"></div><div id="glow"></div>

<div class="abs" id="ca" style="left:0;right:0;top:540px;text-align:center;font-size:23px;letter-spacing:.06em;color:#f1f0f6;font-weight:400">$HUSH · 0x9556664b35d0b77d7ec0f2bdfed787b7e4abb48b</div>
<div class="abs" id="dom" style="left:0;right:0;top:592px;text-align:center;font-size:22px;letter-spacing:.24em;color:#9d9bad">hushmoneyrh.xyz · ROBINHOOD CHAIN</div></div>
<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>1-Math.pow(1-cl(x),3),win=(t,a,b,f=.22)=>cl((t-a)/f)*cl((b-t)/f);
let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const KIND=['cloak','send','uncloak','redeem','blind desk','send','cloak','drop','send','blind desk','redeem','cloak'];
const F=KIND.map((k,i)=>({k,fee:(rnd()*9+0.6),t0:3.4+i*.17,y:150+((i*53)%470)}));
$('fees').innerHTML=F.map((f,i)=>`<div class="fee" id="f${i}">${f.k} · fee ${f.fee.toFixed(2)} hUSD<b>+40%</b></div>`).join('');
window.__seek=(t)=>{
  $('amb').style.transform=`rotate(${t*5}deg) scale(${1+t*.025})`;
  $('s1').style.opacity=win(t,0,1.5);$('t1').style.filter=`blur(${(1-e(t/.55))*26}px)`;$('t1').style.transform=`scale(${.9+e(t/1.4)*.12})`;$('k1').style.opacity=e((t-.2)/.4);
  $('s2').style.opacity=win(t,1.4,3.5);$('pct').textContent=Math.round(e((t-1.5)/1.1)*40)+'%';$('pct').style.transform=`scale(${.92+e((t-1.5)/1.8)*.1})`;
  $('s3').style.opacity=win(t,3.4,5.8);let earned=0;
  F.forEach((f,i)=>{const p=cl((t-f.t0)/.95);const el=$('f'+i);el.style.top=f.y+'px';el.style.opacity=p>0&&p<1?Math.min(1,p*4)*(1-Math.pow(p,3)):0;el.style.transform=`translateX(${e(p)*270}px)`;el.style.filter=`blur(${p*p*7}px)`;if(p>=.85)earned+=f.fee*.4*.12*cl((p-.85)/.15);});
  $('earn').textContent='+'+earned.toFixed(4)+' hUSD';$('glass').style.filter=`blur(${12+Math.sin(t*5)*3}px) hue-rotate(${t*30}deg)`;
  $('s4').style.opacity=win(t,5.7,7.7);['n1','n2','n3'].forEach((id,k)=>{const p=e((t-5.8-k*.45)/.35);$(id).style.opacity=p;$(id).style.transform=`translateY(${(1-p)*30}px)`;$(id).style.filter=`blur(${(1-p)*14}px)`;});
  const p=e((t-7.6)/.8);$('s5').style.opacity=t>=7.6?1:0;$('b1').style.left=(560-(1-p)*700)+'px';$('b2').style.left=(680+(1-p)*700)+'px';$('glow').style.opacity=e((t-8.1)/.6);
  $('tag').style.opacity=e((t-8.1)/.5);$('ca').style.opacity=e((t-8.7)/.5);$('dom').style.opacity=e((t-9)/.5);
};window.__seek(0);
</script>
